# Builds and publishes release artifacts to a GitHub Release. Only ever runs
# on tag pushes matching v* (a tag vX.Y.Z matching Cargo.toml's version - see
# AGENTS.md's versioning convention, pulled from TheHolm/dak since this is a
# single-binary project, not a date-based collective tag like TheHolm/dak-nuggets
# uses for its multi-program releases). Never runs on ordinary branch pushes
# or pull requests, and tags themselves are always created manually - this
# workflow never creates one itself.
#
# This pipeline deliberately mirrors TheHolm/dak's own release.yaml wherever
# it applies here too (same base images/Rust version, same download
# verification, same cargo audit/lintian/SHA256SUMS conventions) - the two
# differ only where clipGPT's actual targets differ from dak's: dak only
# ships Linux+FreeBSD; clipGPT also ships Windows and additionally
# cross-builds aarch64 Linux .debs (dak only builds its native amd64).
#
# Target platforms (all are hard-required, none is best-effort/failure:
# ignore - see AGENTS.md "Target platforms"):
#
#   build-freebsd-pkg             FreeBSD x86_64 .pkg (hand-built sysroot)
#   build-linux-amd64-trixie      Linux x86_64 .deb, Debian Trixie
#   build-linux-arm64-trixie      Linux aarch64 .deb, Debian Trixie
#   build-linux-amd64-ubuntu2604  Linux x86_64 .deb, Ubuntu 26.04
#   build-linux-arm64-ubuntu2604  Linux aarch64 .deb, Ubuntu 26.04
#   build-windows-amd64           Windows x86_64 .exe (mingw-w64)
#   build-windows-arm64           Windows aarch64 .exe (llvm-mingw, gnullvm)
#
# macOS is NOT built here: cross-rs ships no Apple Darwin images (Apple's
# license forbids redistributing the SDK a build needs), and there is no
# custom osxcross setup anywhere in this repo. The previous GitHub Actions
# workflow called `cross build --target aarch64-apple-darwin`/
# `x86_64-apple-darwin` and almost certainly never actually worked - there is
# no evidence it ever succeeded, and cross-rs's own README says as much.
# Likewise, the previous workflow's `aarch64-pc-windows-gnu` target is not
# even a valid rustc target (`aarch64-pc-windows-gnu` does not exist; the
# real target is `aarch64-pc-windows-gnullvm`, used below) - that step would
# have failed immediately with an unknown-target error, not just produced a
# bad binary.
#
# Every step below was individually verified end-to-end in a real sandbox
# session before being written here (not just assumed from documentation):
# each target was actually built, and for build-freebsd-pkg the resulting
# .pkg was unpacked and its manifest inspected. In particular:
#   - actually_beep (and its pinned cpal ^0.15.3) has NO FreeBSD/BSD backend
#     at all; src/beep.rs calls cpal >=0.18 directly instead, which does.
#   - mio must be at least 1.2.4 for the FreeBSD target: 1.0.3 (and other
#     versions before the fix) reference a libc constant
#     (`NOTE_PCTRLMASK`) that does not exist on FreeBSD, breaking the build
#     with no connection to anything in this crate's own code. Cargo.lock
#     already pins mio >=1.2.4; do not downgrade it for a FreeBSD build.
#
# Downloads and how they are verified:
#   - base.txz: against the release MANIFEST, confirmed by independent
#     mirrors (scripts/verify-freebsd-dist.sh)
#   - FreeBSD packages (alsa-lib, openssl closure): each .pkg against the
#     size and checksum in packagesite.yaml, fetched over HTTPS from
#     pkg.freebsd.org (scripts/fetch-freebsd-deps.py)
#   - rustup-init: against the SHA-256 published next to it
#     (scripts/fetch-verified.sh)
#   - llvm-mingw (build-windows-arm64): NOT verified beyond HTTPS from
#     GitHub; its releases publish no checksum file
#   - apt packages, crates, the gh CLI: by apt/cargo's own signatures and
#     checksums (Cargo.lock)
#
# Requirements for this to work (not set up by anything in this repo):
#   - A `github_token` secret set on this repo in Woodpecker (Project
#     Settings -> Secrets), holding a GitHub PAT scoped to Contents:
#     read/write, restricted to the "tag" event.
#   - A push mirror from this Gitea repo to github.com/TheHolm/clipGPT (does
#     not exist yet as of writing), syncing tags promptly, so the tag this
#     workflow is releasing already exists on GitHub when the publish step
#     runs.

when:
  - event: tag
    ref: refs/tags/v*

# Steps run in two lanes so at most two builds share the CI host at once
# (all seven in parallel overloaded it). Each step waits for the previous
# one in its lane; publish waits for every build:
#
#   lane A: build-freebsd-pkg -> build-windows-amd64 -> build-windows-arm64
#   lane B: build-ci-tools -> linux-amd64-trixie -> linux-arm64-trixie
#           -> linux-amd64-ubuntu2604 -> linux-arm64-ubuntu2604
#
# A failing step skips the rest of its lane, and so the publish step: every
# target stays hard-required. FreeBSD, the slowest step, starts lane A.
steps:
  - name: build-freebsd-pkg
    image: rust:1.92-trixie
    depends_on: []
    environment:
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_SYSROOT_DIR: /opt/freebsd-sysroot
      PKG_CONFIG_LIBDIR: /opt/freebsd-sysroot/usr/local/libdata/pkgconfig:/opt/freebsd-sysroot/usr/local/lib/pkgconfig
    commands:
      - sh scripts/check-release-tag.sh "$CI_COMMIT_TAG"
      # File modes are not trusted: a clone/mirror can arrive with the
      # executable bit stripped.
      - chmod +x scripts/*.sh scripts/*.py
      - apt-get update && apt-get install -y --no-install-recommends clang lld zstd python3 pkg-config
      - mkdir -p /opt/freebsd-sysroot
      # FreeBSD base system (libc/CRT/headers). Every member needs the
      # leading `./` for GNU tar's selective extraction to match. Sonames
      # (e.g. libutil.so.N) drift between FreeBSD releases - re-check this
      # list with `tar -tvJf base.txz | grep <libname>` against the current
      # release before bumping the version below. Verified against the real
      # MANIFEST (and 2 independent mirrors) rather than a hardcoded
      # checksum, since that would have to be updated for every release.
      - sh scripts/verify-freebsd-dist.sh releases/amd64/amd64/15.1-RELEASE base.txz /tmp/base.txz
      - >-
        tar -xJf /tmp/base.txz -C /opt/freebsd-sysroot
        ./lib/libc.so.7 ./usr/lib/libc.so ./usr/lib/libc_nonshared.a
        ./lib/libm.so.5 ./usr/lib/libm.so
        ./lib/libutil.so.10 ./usr/lib/libutil.so
        ./lib/librt.so.1 ./usr/lib/librt.so
        ./usr/lib/libexecinfo.so.1 ./usr/lib/libexecinfo.so
        ./lib/libkvm.so.7 ./usr/lib/libkvm.so
        ./usr/lib/libmemstat.so.3 ./usr/lib/libmemstat.so
        ./usr/lib/libprocstat.so.1 ./usr/lib/libprocstat.so
        ./lib/libdevstat.so.7 ./usr/lib/libdevstat.so
        ./lib/libthr.so.3 ./usr/lib/libthr.so ./usr/lib/libpthread.so
        ./lib/libgcc_s.so.1 ./usr/lib/libgcc_s.so
        ./usr/lib/crt1.o ./usr/lib/Scrt1.o ./usr/lib/crti.o ./usr/lib/crtn.o
        ./usr/lib/crtbegin.o ./usr/lib/crtbeginS.o ./usr/lib/crtbeginT.o
        ./usr/lib/crtend.o ./usr/lib/crtendS.o
      - rm -f /tmp/base.txz
      # Native dependency closure: alsa-lib (cpal's ALSA backend - FreeBSD's
      # alsa-lib port implements the ALSA API over the native sound system),
      # openssl (native-tls/reqwest). The clipboard backends (wl-clipboard-rs
      # and its x11rb fallback) need no native library at all - both are
      # pure Rust by default, no libxcb or libwayland-client linking
      # required. Confirmed FreeBSD package
      # names - do not guess new ones without checking
      # https://cgit.freebsd.org/ports first. Each downloaded .pkg is checked
      # against packagesite.yaml's size and checksum before it is unpacked.
      - >-
        python3 scripts/fetch-freebsd-deps.py --sysroot /opt/freebsd-sysroot
        --root alsa-lib --root openssl
        --pkg-config-check alsa --pkg-config-check openssl
        --deps-output /opt/freebsd-deps.json
      - rustup target add x86_64-unknown-freebsd
      - ./scripts/ci-freebsd.sh /opt/freebsd-sysroot /opt/freebsd-stage dist /opt/freebsd-deps.json

  # cargo-deb and cargo-audit are compiled once here into the shared
  # workspace (.ci-tools/bin) instead of in every .deb step. Built against
  # trixie's glibc, they also run in the ubuntu:26.04 steps (newer glibc);
  # the arm64 steps cross-compile on the amd64 host, so they run the same
  # amd64 tools. Removed first: the workspace can persist between runs, and
  # a stale or half-built tool must never be reused.
  - name: build-ci-tools
    image: rust:1.92-trixie
    depends_on: []
    commands:
      - sh scripts/check-release-tag.sh "$CI_COMMIT_TAG"
      - rm -rf .ci-tools
      - cargo install cargo-deb --locked --version 3.8.0 --root .ci-tools
      - cargo install cargo-audit --locked --version 0.22.2 --root .ci-tools
      - .ci-tools/bin/cargo-deb --version
      - .ci-tools/bin/cargo-audit --version

  - name: build-linux-amd64-trixie
    image: rust:1.92-trixie
    depends_on: [build-ci-tools]
    environment:
      CARGO_TARGET_DIR: target/linux-amd64-trixie
    commands:
      - sh scripts/check-release-tag.sh "$CI_COMMIT_TAG"
      - apt-get update && apt-get install -y --no-install-recommends libasound2-dev libssl-dev pkg-config lintian
      - export PATH="$CI_WORKSPACE/.ci-tools/bin:$PATH"
      # Fails the release when a dependency in Cargo.lock has a published
      # advisory, or is yanked. Every build below uses --locked, so what
      # is built is exactly the Cargo.lock audited here: a lock file that
      # cargo would have to update fails the build instead of being
      # silently changed. cargo fetch populates cargo's own index cache
      # first, and .cargo/audit.toml tells cargo-audit to read that
      # instead of re-downloading each of the ~280 locked crates' index
      # entries itself for the yanked check, which has a hard-coded 10 s
      # timeout per crate with no way to raise it and timed out on most
      # of them here every time (https://github.com/RustSec/rustsec,
      # rustsec::cached_index::REQUEST_TIMEOUT).
      - cargo fetch --locked
      - cargo audit
      - cargo deb --locked --target x86_64-unknown-linux-gnu --deb-revision "1~trixie"
      - mkdir -p dist
      - cp target/linux-amd64-trixie/x86_64-unknown-linux-gnu/debian/*.deb dist/
      # Build-time smoke test: confirm the binary actually landed in the
      # built package, the licence text (not just its name) made it into
      # the explicitly-installed copyright file, and a Debian changelog
      # was generated from debian/changelog (Debian Policy 12.7 requires
      # one for a non-native package, which every "~<distro>"
      # deb-revision here makes this). Each .deb step matches its own
      # exact file name (clip-gpt_<ver>-1~<distro>_<arch>.deb): dist/ is
      # shared, so a loose glob could match another step's package.
      # lintian's default --fail-on error means this step only fails the
      # build on an E: tag; a W:/I: tag is printed but doesn't fail it.
      - dpkg-deb -c dist/*~trixie_amd64.deb | grep -qF 'usr/bin/clip_gpt'
      - dpkg-deb -c dist/*~trixie_amd64.deb | grep -qF 'usr/share/man/man1/clip_gpt.1.gz'
      - dpkg-deb -c dist/*~trixie_amd64.deb | grep -qF 'usr/share/doc/clip-gpt/changelog.Debian.gz'
      - dpkg-deb --fsys-tarfile dist/*~trixie_amd64.deb | tar -xO ./usr/share/doc/clip-gpt/copyright | grep -qi 'GNU AFFERO GENERAL PUBLIC LICENSE'
      - lintian --info dist/*~trixie_amd64.deb

  - name: build-linux-arm64-trixie
    image: rust:1.92-trixie
    depends_on: [build-linux-amd64-trixie]
    environment:
      CARGO_TARGET_DIR: target/linux-arm64-trixie
    commands:
      - sh scripts/check-release-tag.sh "$CI_COMMIT_TAG"
      - dpkg --add-architecture arm64
      - apt-get update && apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross libasound2-dev:arm64 libssl-dev:arm64 pkg-config lintian
      - rustup target add aarch64-unknown-linux-gnu
      - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
      - export PKG_CONFIG_ALLOW_CROSS=1
      - export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
      - export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
      - export PATH="$CI_WORKSPACE/.ci-tools/bin:$PATH"
      - cargo deb --locked --target aarch64-unknown-linux-gnu --deb-revision "1~trixie"
      - mkdir -p dist
      - cp target/linux-arm64-trixie/aarch64-unknown-linux-gnu/debian/*.deb dist/
      - dpkg-deb -c dist/*~trixie_arm64.deb | grep -qF 'usr/bin/clip_gpt'
      - dpkg-deb -c dist/*~trixie_arm64.deb | grep -qF 'usr/share/man/man1/clip_gpt.1.gz'
      - dpkg-deb -c dist/*~trixie_arm64.deb | grep -qF 'usr/share/doc/clip-gpt/changelog.Debian.gz'
      - dpkg-deb --fsys-tarfile dist/*~trixie_arm64.deb | tar -xO ./usr/share/doc/clip-gpt/copyright | grep -qi 'GNU AFFERO GENERAL PUBLIC LICENSE'
      - lintian --info dist/*~trixie_arm64.deb

  - name: build-linux-amd64-ubuntu2604
    image: ubuntu:26.04
    depends_on: [build-linux-arm64-trixie]
    environment:
      CARGO_TARGET_DIR: target/linux-amd64-ubuntu2604
    commands:
      - sh scripts/check-release-tag.sh "$CI_COMMIT_TAG"
      - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates build-essential libasound2-dev libssl-dev pkg-config lintian
      # rustup-init checked against the SHA-256 published next to it, instead of
      # piping https://sh.rustup.rs into a shell.
      - sh scripts/fetch-verified.sh https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init /tmp/rustup-init
      - chmod +x /tmp/rustup-init && /tmp/rustup-init -y --profile minimal --default-toolchain 1.92.0
      - . "$HOME/.cargo/env"
      - export PATH="$CI_WORKSPACE/.ci-tools/bin:$PATH"
      - cargo deb --locked --deb-revision "1~ubuntu2604"
      - mkdir -p dist
      - cp target/linux-amd64-ubuntu2604/debian/*.deb dist/
      - dpkg-deb -c dist/*~ubuntu2604_amd64.deb | grep -qF 'usr/bin/clip_gpt'
      - dpkg-deb -c dist/*~ubuntu2604_amd64.deb | grep -qF 'usr/share/man/man1/clip_gpt.1.gz'
      - dpkg-deb -c dist/*~ubuntu2604_amd64.deb | grep -qF 'usr/share/doc/clip-gpt/changelog.Debian.gz'
      - dpkg-deb --fsys-tarfile dist/*~ubuntu2604_amd64.deb | tar -xO ./usr/share/doc/clip-gpt/copyright | grep -qi 'GNU AFFERO GENERAL PUBLIC LICENSE'
      - lintian --info dist/*~ubuntu2604_amd64.deb

  - name: build-linux-arm64-ubuntu2604
    image: ubuntu:26.04
    depends_on: [build-linux-amd64-ubuntu2604]
    environment:
      CARGO_TARGET_DIR: target/linux-arm64-ubuntu2604
    commands:
      - sh scripts/check-release-tag.sh "$CI_COMMIT_TAG"
      - dpkg --add-architecture arm64
      - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates build-essential gcc-aarch64-linux-gnu libc6-dev-arm64-cross libasound2-dev:arm64 libssl-dev:arm64 pkg-config lintian
      - sh scripts/fetch-verified.sh https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init /tmp/rustup-init
      - chmod +x /tmp/rustup-init && /tmp/rustup-init -y --profile minimal --default-toolchain 1.92.0
      - . "$HOME/.cargo/env"
      - rustup target add aarch64-unknown-linux-gnu
      - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
      - export PKG_CONFIG_ALLOW_CROSS=1
      - export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
      - export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
      - export PATH="$CI_WORKSPACE/.ci-tools/bin:$PATH"
      - cargo deb --locked --target aarch64-unknown-linux-gnu --deb-revision "1~ubuntu2604"
      - mkdir -p dist
      - cp target/linux-arm64-ubuntu2604/aarch64-unknown-linux-gnu/debian/*.deb dist/
      - dpkg-deb -c dist/*~ubuntu2604_arm64.deb | grep -qF 'usr/bin/clip_gpt'
      - dpkg-deb -c dist/*~ubuntu2604_arm64.deb | grep -qF 'usr/share/man/man1/clip_gpt.1.gz'
      - dpkg-deb -c dist/*~ubuntu2604_arm64.deb | grep -qF 'usr/share/doc/clip-gpt/changelog.Debian.gz'
      - dpkg-deb --fsys-tarfile dist/*~ubuntu2604_arm64.deb | tar -xO ./usr/share/doc/clip-gpt/copyright | grep -qi 'GNU AFFERO GENERAL PUBLIC LICENSE'
      - lintian --info dist/*~ubuntu2604_arm64.deb

  - name: build-windows-amd64
    image: rust:1.92-trixie
    depends_on: [build-freebsd-pkg]
    commands:
      - sh scripts/check-release-tag.sh "$CI_COMMIT_TAG"
      - apt-get update && apt-get install -y --no-install-recommends mingw-w64
      # mingw-w64's win32/posix gcc variants need an explicit
      # update-alternatives pass or the package is left half-configured.
      - dpkg --configure -a
      - rustup target add x86_64-pc-windows-gnu
      - export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
      - cargo build --locked --release --target x86_64-pc-windows-gnu
      - mkdir -p dist
      - cp target/x86_64-pc-windows-gnu/release/clip_gpt.exe dist/clip_gpt-x86_64-pc-windows-gnu.exe

  - name: build-windows-arm64
    image: rust:1.92-trixie
    depends_on: [build-windows-amd64]
    commands:
      - sh scripts/check-release-tag.sh "$CI_COMMIT_TAG"
      # Classic GNU mingw-w64 has no ARM64 Windows support at all - only the
      # LLVM-based mingw (llvm-mingw) does, targeting the gnullvm ABI
      # (aarch64-pc-windows-gnullvm, NOT aarch64-pc-windows-gnu, which is not
      # a real rustc target). The download is only protected by HTTPS: the
      # llvm-mingw releases publish no checksum to verify it against.
      - apt-get update && apt-get install -y --no-install-recommends curl xz-utils ca-certificates
      - curl -fsSL -o /tmp/llvm-mingw.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64.tar.xz
      - mkdir -p /opt/llvm-mingw
      - tar -xJf /tmp/llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
      - rm -f /tmp/llvm-mingw.tar.xz
      - export PATH=/opt/llvm-mingw/bin:$PATH
      - rustup target add aarch64-pc-windows-gnullvm
      - export CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER=aarch64-w64-mingw32-clang
      - export AR_aarch64_pc_windows_gnullvm=aarch64-w64-mingw32-ar
      - export CC_aarch64_pc_windows_gnullvm=aarch64-w64-mingw32-clang
      - cargo build --locked --release --target aarch64-pc-windows-gnullvm
      - mkdir -p dist
      - cp target/aarch64-pc-windows-gnullvm/release/clip_gpt.exe dist/clip_gpt-aarch64-pc-windows-gnullvm.exe

  - name: publish-github-release
    image: rust:1.92-trixie
    depends_on:
      - build-ci-tools
      - build-freebsd-pkg
      - build-linux-amd64-trixie
      - build-linux-arm64-trixie
      - build-linux-amd64-ubuntu2604
      - build-linux-arm64-ubuntu2604
      - build-windows-amd64
      - build-windows-arm64
    environment:
      GH_TOKEN:
        from_secret: github_token
    commands:
      - sh scripts/check-release-tag.sh "$CI_COMMIT_TAG"
      - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gnupg
      - mkdir -p -m 755 /etc/apt/keyrings
      - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
      - chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
      - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
      - apt-get update && apt-get install -y --no-install-recommends gh
      - ./scripts/extract-release-notes.sh "$CI_COMMIT_TAG" RELEASE_NOTES.md > /tmp/release-notes.md
      # GitHub replaces '~' with '.' in release asset file names on upload
      # (observed on the v0.4.0 release: dist/clip-gpt_0.4.0-1~trixie_amd64.deb
      # was published as clip-gpt_0.4.0-1.trixie_amd64.deb) - only the .deb
      # names contain '~' (the FreeBSD .pkg, the .exe files and SHA256SUMS
      # itself never do). Rename here first, before SHA256SUMS is written,
      # so its names already match what gh uploads and `sha256sum -c
      # SHA256SUMS` works against the files as actually downloaded.
      - |
        for f in dist/*; do
          case "$f" in
            *'~'*) mv -- "$f" "$(printf '%s' "$f" | tr '~' '.')" ;;
          esac
        done
      # Checksums of everything released, so downloads can be checked.
      - cd dist && sha256sum -- * > SHA256SUMS && cd ..
      # Idempotent: create the release, or update it in place when a tag is
      # re-released, so republishing the same tag never hard-fails. (dak's
      # own equivalent step only does a one-shot `gh release create`, since
      # its tags are never reused - kept this extra fallback here anyway.)
      - |
        if gh release view "$CI_COMMIT_TAG" --repo TheHolm/clipGPT >/dev/null 2>&1; then
          gh release edit "$CI_COMMIT_TAG" \
            --repo TheHolm/clipGPT \
            --title "$CI_COMMIT_TAG" \
            --notes-file /tmp/release-notes.md
          gh release upload "$CI_COMMIT_TAG" dist/* \
            --repo TheHolm/clipGPT \
            --clobber
        else
          gh release create "$CI_COMMIT_TAG" dist/* \
            --repo TheHolm/clipGPT \
            --title "$CI_COMMIT_TAG" \
            --notes-file /tmp/release-notes.md
        fi
