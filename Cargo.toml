[package]
name = "clip_gpt"
version = "0.5.0"
authors = [ "TheHolm" ]
license = "AGPL-3.0-or-later"
rust-version = "1.92"
edition = "2021"
# default-run = "clipGPT"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pretty_ini = "0.1"
native-tls = "0.2.13"
cpal = "0.18"
regex = "1.12"
base64 = "0.23"
# Clipboard images other than PNG/JPEG (WebP, GIF, BMP/Windows DIB, TIFF)
# are converted to PNG, the one format every OpenAI-compatible server
# decodes. Only these pure-Rust codecs are enabled - no native library on
# any target, and no JPEG/AVIF/EXR code that is never used.
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "bmp", "tiff"] }

# Clipboard access is OS-specific: Linux/FreeBSD use wl-clipboard-rs
# (Wayland data-control) first and x11rb (X11/Xwayland) as fallback, e.g.
# on GNOME, whose compositor has no data-control protocol. x11rb is pure
# Rust with no native library; unlike the old `clipboard`/`x11-clipboard`
# crates it does not pull in xcb 0.8.2, unmaintained since 2022 with real
# soundness advisories (RUSTSEC-2021-0019). Windows keeps the same underlying backend the old
# cross-platform `clipboard` crate used there (clipboard-win), just called
# directly instead of through that abstraction. macOS talks to
# NSPasteboard directly through the maintained objc2 bindings, which (unlike
# the old unmaintained `clipboard` crate) can list the clipboard's types -
# needed for images and for password-manager markers.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wl-clipboard-rs = "0.9"
x11rb = "0.14"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }

[package.metadata.deb]
maintainer = "TheHolm"
extended-description = """Interact with LLM via clipboard"""
depends = "$auto"
section = "utility"
priority = "optional"
# debian/copyright is installed explicitly as the package's one licence
# file (Debian Policy 12.5, followed by Ubuntu): with an asset at that path
# cargo-deb does not generate its own, which only names the licence
# ("License: AGPL-3.0-or-later") without its text - AGPL is not guaranteed
# to be present in /usr/share/common-licenses, so it must be quoted in full.
# The binary goes to /usr/bin and the man page to /usr/share/man: Debian
# Policy 9.1.2 (same on Ubuntu) leaves /usr/local to the local admin, so no
# package may install there. cargo-deb gzips the man page itself (-9n).
assets = [
 ["target/release/clip_gpt", "usr/bin/", "755"],
 ["man/clip_gpt.1", "usr/share/man/man1/clip_gpt.1", "644"],
 ["debian/copyright", "usr/share/doc/clip-gpt/copyright", "644"],
]
