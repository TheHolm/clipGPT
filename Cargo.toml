[package]
name = "clip_gpt"
version = "0.1.0"
authors = [ "TheHolm" ]
license = "AGPL-3.0-or-later"
rust-version = "1.92"
edition = "2021"
# default-run = "clipGPT"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pretty_ini = "0.1"
native-tls = "0.2.13"
cpal = "0.18"

# Clipboard access is OS-specific: Linux/FreeBSD use wl-clipboard-rs
# (Wayland only - the old `clipboard`/`x11-clipboard` crates pulled in
# xcb 0.8.2, unmaintained since 2022 with real soundness advisories
# (RUSTSEC-2021-0019); X11 desktops are no longer supported as a result,
# by choice). Windows keeps the same underlying backend the old
# cross-platform `clipboard` crate used there (clipboard-win), just called
# directly instead of through that abstraction. macOS keeps the old
# `clipboard` crate purely for its Cocoa backend, since the audit problem
# was specifically in its X11 backend, not here.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wl-clipboard-rs = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4"

[target.'cfg(target_os = "macos")'.dependencies]
clipboard = "0.5"

[package.metadata.deb]
maintainer = "TheHolm"
extended-description = """Interact with LLM via clipboard"""
depends = "$auto"
section = "utility"
priority = "optional"
# debian/copyright is installed explicitly as the package's one licence
# file (Debian Policy 12.5, followed by Ubuntu): with an asset at that path
# cargo-deb does not generate its own, which only names the licence
# ("License: AGPL-3.0-or-later") without its text - AGPL is not guaranteed
# to be present in /usr/share/common-licenses, so it must be quoted in full.
assets = [
 ["target/release/clip_gpt", "usr/local/bin/", "755"],
 ["debian/copyright", "usr/share/doc/clip-gpt/copyright", "644"],
]
